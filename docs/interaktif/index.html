<title>Türkiye İletim Şebekesi</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Düzen: tek ekran kontrol odası — solda coğrafi şebeke, sağda çalışma paneli (telefonda alt alta) */
:root {
  --zemin: #eef1f4;      /* panel kâğıdı, hafif mavi-gri */
  --yuzey: #ffffff;
  --cizgi: #cfd6de;
  --metin: #18212b;
  --soluk: #5b6875;
  --vurgu: #d0342c;      /* 380 kV kırmızısı — Türk şebeke haritalarındaki geleneksel renk */
  --kv154: #e08a1e;
  --kvyok: #9aa6b2;
  --kenar: #b8c2cc;
  --dusen: #d0342c;
  --kopuk: #7b5cc4;
  --ok: #1f8a5b;
  --f-baslik: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-govde: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-veri: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #12171d; --yuzey: #1a2129; --cizgi: #2c3640; --metin: #e6ebf0; --soluk: #95a2af;
    --vurgu: #ff5a4e; --kv154: #f0a040; --kvyok: #6b7783; --kenar: #3a4651;
    --dusen: #ff5a4e; --kopuk: #a98bf0; --ok: #3cc488; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #12171d; --yuzey: #1a2129; --cizgi: #2c3640; --metin: #e6ebf0; --soluk: #95a2af;
  --vurgu: #ff5a4e; --kv154: #f0a040; --kvyok: #6b7783; --kenar: #3a4651;
  --dusen: #ff5a4e; --kopuk: #a98bf0; --ok: #3cc488; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--zemin); color: var(--metin);
  font: 15px/1.45 var(--f-govde);
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--cizgi); background: var(--yuzey);
}
header h1 {
  font: 700 1.45rem/1.1 var(--f-baslik); letter-spacing: .01em; margin: 0;
  text-wrap: balance; text-transform: uppercase;
}
header h1 span { color: var(--vurgu); }
header .alt { color: var(--soluk); font-size: .85rem; flex: 1 1 260px; min-width: 0; }
.dil { display: flex; border: 1px solid var(--cizgi); border-radius: 6px; overflow: hidden; }
.dil button {
  font: 600 .8rem var(--f-veri); padding: 5px 10px; border: 0; background: transparent;
  color: var(--soluk); cursor: pointer;
}
.dil button[aria-pressed="true"] { background: var(--metin); color: var(--yuzey); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
#ag { position: relative; min-height: 0; }
#cy { position: absolute; inset: 0; }
.harita-not {
  position: absolute; left: 12px; bottom: 10px; font: .72rem var(--f-veri); color: var(--soluk);
  background: color-mix(in srgb, var(--zemin) 80%, transparent); padding: 3px 6px; border-radius: 4px;
}
.yakinlik { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.yakinlik button {
  width: 34px; height: 34px; font: 600 1rem var(--f-veri); border: 1px solid var(--cizgi);
  background: var(--yuzey); color: var(--metin); border-radius: 6px; cursor: pointer;
}
aside {
  border-left: 1px solid var(--cizgi); background: var(--yuzey); overflow-y: auto;
  display: flex; flex-direction: column;
}
section { padding: 14px 16px; border-bottom: 1px solid var(--cizgi); display: grid; gap: 8px; }
h2 {
  font: 600 .78rem var(--f-veri); text-transform: uppercase; letter-spacing: .08em;
  color: var(--soluk); margin: 0;
}
input[type=search], select {
  width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--cizgi); border-radius: 6px;
  background: var(--zemin); color: var(--metin);
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.sonuclar { display: grid; gap: 2px; max-height: 180px; overflow-y: auto; }
.sonuclar button {
  text-align: left; font: inherit; font-size: .9rem; padding: 5px 8px; border: 0; border-radius: 4px;
  background: transparent; color: var(--metin); cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
}
.sonuclar button:hover { background: var(--zemin); }
.sonuclar small { color: var(--soluk); white-space: nowrap; }
.boyama { display: flex; gap: 6px; flex-wrap: wrap; }
.boyama button, .btn {
  font: 600 .8rem var(--f-govde); padding: 6px 10px; border: 1px solid var(--cizgi); border-radius: 999px;
  background: transparent; color: var(--metin); cursor: pointer;
}
.boyama button[aria-pressed="true"] { background: var(--metin); color: var(--yuzey); border-color: var(--metin); }
.lejant { display: grid; gap: 4px; font-size: .85rem; }
.lejant div { display: flex; align-items: center; gap: 8px; }
.lejant i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.lejant .cizgi-ornek { width: 18px; height: 3px; border-radius: 2px; }
.topluluklar { display: grid; gap: 3px; }
.topluluklar label { display: flex; gap: 8px; align-items: center; font-size: .88rem; cursor: pointer; }
.topluluklar label small { color: var(--soluk); margin-left: auto; font-family: var(--f-veri); }
.topluluklar i { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.detay h3 { font: 700 1.35rem/1.1 var(--f-baslik); margin: 0; text-transform: uppercase; }
.detay .yer { color: var(--soluk); font-size: .88rem; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: .88rem; }
dt { color: var(--soluk); }
dd { margin: 0; font-family: var(--f-veri); font-variant-numeric: tabular-nums; text-align: right; }
.rozet {
  display: inline-block; font: 600 .72rem var(--f-veri); padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: .05em;
}
.rozet.kritik { background: color-mix(in srgb, var(--kopuk) 18%, transparent); color: var(--kopuk); }
.rozet.normal { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.kutu {
  border: 1px solid var(--cizgi); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px;
  background: var(--zemin);
}
.kutu p { margin: 0; font-size: .88rem; }
.alfa { display: flex; align-items: center; gap: 10px; font-size: .88rem; }
.alfa input { flex: 1; accent-color: var(--vurgu); }
.alfa output { font-family: var(--f-veri); min-width: 3.5em; text-align: right; }
.btn.ana { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.dalgalar { display: grid; gap: 3px; font: .8rem var(--f-veri); }
.dalgalar div { display: flex; justify-content: space-between; gap: 8px; }
.cubuk { height: 8px; background: var(--cizgi); border-radius: 4px; overflow: hidden; }
.cubuk b { display: block; height: 100%; background: var(--ok); transition: width .4s; }
.bos { color: var(--soluk); font-size: .88rem; margin: 0; }
footer.kaynak { padding: 12px 16px; font-size: .75rem; color: var(--soluk); }
footer.kaynak a { color: inherit; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: 50vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--cizgi); overflow: visible; }
  body { height: auto; }
  html { height: auto; }
}
@media (prefers-reduced-motion: reduce) { .cubuk b { transition: none; } }
</style>

const N = VERI.dugumler.length;
const idx = new Map(VERI.dugumler.map((d, i) => [d.id, i]));
const komsu = Array.from({ length: N }, () => []);
for (const k of VERI.kenarlar) { const a = idx.get(k.s), b = idx.get(k.t); komsu[a].push(b); komsu[b].push(a); }

// Brandes betweenness (yönsüz, normalize edilmemiş; networkx ile aynı tanım)
function betweenness(aktif) {
  const CB = new Float64Array(N), sigma = new Float64Array(N), dist = new Int32Array(N), delta = new Float64Array(N);
  const S = new Int32Array(N), Q = new Int32Array(N);
  const P = Array.from({ length: N }, () => []);
  for (let s = 0; s < N; s++) {
    if (!aktif[s]) continue;
    for (let i = 0; i < N; i++) { P[i].length = 0; sigma[i] = 0; dist[i] = -1; delta[i] = 0; }
    sigma[s] = 1; dist[s] = 0;
    let qh = 0, qt = 0, sp = 0; Q[qt++] = s;
    while (qh < qt) {
      const v = Q[qh++]; S[sp++] = v;
      for (const w of komsu[v]) {
        if (!aktif[w]) continue;
        if (dist[w] < 0) { dist[w] = dist[v] + 1; Q[qt++] = w; }
        if (dist[w] === dist[v] + 1) { sigma[w] += sigma[v]; P[w].push(v); }
      }
    }
    while (sp > 0) {
      const w = S[--sp];
      for (const v of P[w]) delta[v] += sigma[v] / sigma[w] * (1 + delta[w]);
      if (w !== s) CB[w] += delta[w];
    }
  }
  for (let i = 0; i < N; i++) CB[i] /= 2;
  return CB;
}
function enBuyukParca(aktif) {
  const gor = new Uint8Array(N); let en = 0;
  for (let s = 0; s < N; s++) {
    if (!aktif[s] || gor[s]) continue;
    let say = 0; const yigin = [s]; gor[s] = 1;
    while (yigin.length) { const v = yigin.pop(); say++; for (const w of komsu[v]) if (aktif[w] && !gor[w]) { gor[w] = 1; yigin.push(w); } }
    en = Math.max(en, say);
  }
  return en;
}
// bir merkez düşerse ana parçadan kopanlar
function kopanlar(v) {
  const aktif = new Uint8Array(N).fill(1); aktif[v] = 0;
  const etiket = new Int32Array(N).fill(-1); const boy = [];
  for (let s = 0; s < N; s++) {
    if (!aktif[s] || etiket[s] >= 0) continue;
    const c = boy.length; let say = 0; const y = [s]; etiket[s] = c;
    while (y.length) { const u = y.pop(); say++; for (const w of komsu[u]) if (aktif[w] && etiket[w] < 0) { etiket[w] = c; y.push(w); } }
    boy.push(say);
  }
  const ana = boy.indexOf(Math.max(...boy));
  const out = [];
  for (let i = 0; i < N; i++) if (aktif[i] && etiket[i] !== ana) out.push(i);
  return out;
}
let L0 = null;
function kaskad(bas, alfa) {
  if (!L0) L0 = betweenness(new Uint8Array(N).fill(1));
  const aktif = new Uint8Array(N).fill(1); aktif[bas] = 0;
  const dalgalar = [[bas]];
  for (let adim = 0; adim < 30; adim++) {
    const yuk = betweenness(aktif); const asan = [];
    for (let i = 0; i < N; i++) if (aktif[i] && yuk[i] > (1 + alfa) * L0[i] + 1e-9) asan.push(i);
    if (!asan.length) break;
    for (const i of asan) aktif[i] = 0;
    dalgalar.push(asan);
  }
  return { dalgalar, G: enBuyukParca(aktif) / N };
}

function toplulukRenk(no) { return no >= 0 && no < PALET.length ? PALET[no] : css('--kvyok'); }

    { selector: 'edge', style: {

    { selector: '.soluk', style: { opacity: 0.12 } },

    { selector: 'node.bas', style: { 'background-color': css('--metin'), width: () => 16 * olc(), height: () => 16 * olc(), 'border-color': css('--dusen'), 'border-width': 3, 'z-index': 9 } },
    { selector: 'node.secili', style: { 'border-color': css('--metin'), 'border-width': 3, 'z-index': 10, label: 'data(ad)', 'font-size': () => 12 / cy.zoom(),
      color: css('--metin'), 'text-outline-color': css('--zemin'), 'text-outline-width': 2, 'text-valign': 'top', 'text-margin-y': -4,

  ];

function boya() {
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const d = bilgi[n.id()];
      n.data({ renk: dugumRenk(d), boy: 4 + 1.7 * d.derece, ad: d.ad, etiket: d.etiket || undefined });
      const gizli = !gorunur.has(d.top < PALET.length ? d.top : -1);
      n.toggleClass('soluk', gizli);
      n.removeClass('dusen kopuk bas');
      const s = durum.get(n.id()); if (s) n.addClass(s);
      n.toggleClass('secili', n.id() === secili);
    });
    cy.edges().forEach(e => {
      const a = bilgi[e.data('source')], b = bilgi[e.data('target')];
      const gizli = !gorunur.has(a.top < PALET.length ? a.top : -1) && !gorunur.has(b.top < PALET.length ? b.top : -1);
      e.toggleClass('soluk', gizli);
      e.toggleClass('olu', durum.has(e.data('source')) || durum.has(e.data('target')));
    });
  });
  lejant();
}
